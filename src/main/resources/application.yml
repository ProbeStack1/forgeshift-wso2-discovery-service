spring:
  application:
    name: forgeshift-wso2-discovery-service
  # Load .env from the working directory as a property source. The
  # "optional:" prefix means the app still boots if .env is absent (CI, prod).
  # The "[.properties]" suffix tells Spring to parse the file as KEY=VALUE.
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_WSO2_URI:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-wso2-forgeshift?appName=probestack-prod}
      database: ${MONGODB_WSO2_DATABASE:probestack-wso2-forgeshift}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /wso2/discovery/v1
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.forgeshift: INFO
    org.springframework.web: INFO
    org.mongodb.driver: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# --- Application properties ---
forgeshift:
  mongodb:
    pool:
      max-size: ${MONGODB_MAX_POOL_SIZE:20}
      min-size: ${MONGODB_MIN_POOL_SIZE:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:*}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${CORS_EXPOSED_HEADERS:*}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}
  wso2:
    base-url: ${WSO2_BASE_URL:https://34.133.77.23:9443}
    username: ${WSO2_USERNAME:admin}
    password: ${WSO2_PASSWORD:admin}
    client-id: ${WSO2_CLIENT_ID:ZmLW27abbLLQtXgREb2qBpp3M8wa}
    client-secret: ${WSO2_CLIENT_SECRET:by7XwGMhFGFBY3ZzArbf_MNVqx0a}
    trust-self-signed: ${WSO2_TRUST_SELF_SIGNED:true}
    publisher-api-base: /api/am/publisher/v4
    admin-api-base: /api/am/admin/v4
    devportal-api-base: /api/am/devportal/v3
    scim-api-base: /scim2
    scim-users-path: /Users
    token-path: /oauth2/token
    soap:
      user-store-service-path: ${WSO2_SOAP_USER_STORE_SERVICE_PATH:/services/RemoteUserStoreManagerService}
      user-admin-service-path: ${WSO2_SOAP_USER_ADMIN_SERVICE_PATH:/services/UserAdmin}
      namespace: ${WSO2_SOAP_NAMESPACE:http://service.ws.um.carbon.wso2.org}
      user-admin-namespace: ${WSO2_SOAP_USER_ADMIN_NAMESPACE:http://org.apache.axis2/xsd}
      user-filter: ${WSO2_SOAP_USER_FILTER:*}
      max-users: ${WSO2_SOAP_MAX_USERS:100}
      profile-name: ${WSO2_SOAP_PROFILE_NAME:default}
      email-claim: ${WSO2_SOAP_EMAIL_CLAIM:http://wso2.org/claims/emailaddress}
      first-name-claim: ${WSO2_SOAP_FIRST_NAME_CLAIM:http://wso2.org/claims/givenname}
      last-name-claim: ${WSO2_SOAP_LAST_NAME_CLAIM:http://wso2.org/claims/lastname}
      include-role-permissions: ${WSO2_SOAP_INCLUDE_ROLE_PERMISSIONS:false}
      user-discovery-parallelism: ${WSO2_SOAP_USER_DISCOVERY_PARALLELISM:10}
      role-permission-parallelism: ${WSO2_SOAP_ROLE_PERMISSION_PARALLELISM:5}
      max-role-permissions-per-role: ${WSO2_SOAP_MAX_ROLE_PERMISSIONS_PER_ROLE:10}
    kong:
      # Konnect credentials normally come from the kong_konnect_profiles
      # collection written by the profile-config service; the *-fallback values
      # below only apply when no profile matches the requesting company.
      profiles-collection: ${KONG_KONNECT_PROFILES_COLLECTION:kong_konnect_profiles}
      base-url-fallback: ${KONNECT_BASE_URL:https://us.api.konghq.com}
      access-token-fallback: ${KONNECT_PAT:}
      control-plane-id-fallback: ${KONNECT_CONTROL_PLANE_ID:}
      consumers-path: ${KONG_CONSUMERS_PATH:/consumers}
      acl-path-template: ${KONG_ACL_PATH_TEMPLATE:/consumers/{consumer}/acls}
      request-timeout-seconds: ${KONG_REQUEST_TIMEOUT_SECONDS:30}
      migrated-by-tag: ${KONG_MIGRATED_BY_TAG:migrated-by:forgeshift-wso2-migrator}
      source-user-tag-prefix: ${KONG_SOURCE_USER_TAG_PREFIX:wso2-source-user}
      tenant-tag-prefix: ${KONG_TENANT_TAG_PREFIX:wso2-tenant}
      principal-type-tag: ${KONG_PRINCIPAL_TYPE_TAG:principal-type:user}
      # Keeps migrated users out of the consumer namespace the migration
      # service uses for WSO2 applications. Usernames become
      # <prefix>.<tenant>.<user>, e.g. user.carbon-super.api-developer.
      consumer-username-prefix: ${KONG_CONSUMER_USERNAME_PREFIX:user}
      # Konnect identity API: global host at v3, unlike the regional v2 host
      # used for control plane entities. Teams are organization-wide.
      identity-base-url: ${KONNECT_IDENTITY_BASE_URL:https://global.api.konghq.com}
      identity-users-path: ${KONNECT_IDENTITY_USERS_PATH:/v3/users}
      identity-teams-path: ${KONNECT_IDENTITY_TEAMS_PATH:/v3/teams}
    publisher-scope: apim:api_view
    admin-scope: apim:admin
    devportal-scope: apim:subscribe
    request-timeout-seconds: 30
    page-size: 50
  discovery:
    collection-prefix: discovery_wso2_
    revisions-collection: discovery_revisions
    revision-map-collection: discovery_revision_map
    audit-collection: wso2_migration_audit_info
    organizations-collection: wso2_organizations
    profiles-collection: wso2_profiles
    user-profiles-collection: wso2_user_profiles
    user-role-mappings-collection: wso2_kong_role_mapping
    user-migration-collection: wso2_kong_user_migration
    default-company-name: probestack
    parallel-thread-pool-size: ${FORGESHIFT_DISCOVERY_PARALLEL_DOWNLOADS:4}
    download-timeout-seconds: ${FORGESHIFT_DISCOVERY_DOWNLOAD_TIMEOUT_SECONDS:60}
